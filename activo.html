<body data-page="activo"><main data-esqueleto="kpis,grafico,tabla">
<h1 data-i18n="activo.titulo">Detalle de activo</h1>
<p class="sub" data-i18n="activo.sub">Precio, volumen, riesgo y lo que dicen los modelos sobre un activo.</p>
<!-- El aviso de simulación lo inserta js/common.js aquí, según el modo de datos -->
<section class="card activo-cab" aria-labelledby="h-activo">
  <h2 id="h-activo" class="sr" data-i18n="activo.resumen_titulo">Resumen del activo</h2>
  <div class="row">
    <div><label for="sel-activo" data-i18n="comun.activo">Activo</label><select id="sel-activo"></select></div>
    <div><span class="rotulo" data-i18n="dashboard.rango">Periodo</span><div id="rango"></div></div>
  </div>
  <div id="cabecera"></div>
</section>
<div class="grid kpis-activo" id="kpis"></div>
<div id="grafico"></div>
<div class="dos-col">
  <section class="card" aria-labelledby="h-modelos">
    <h2 id="h-modelos" data-i18n="activo.modelos_titulo">Qué dicen los modelos</h2>
    <div id="modelos"></div>
  </section>
  <section class="card" aria-labelledby="h-corr">
    <h2 id="h-corr" data-i18n="activo.corr_titulo">Correlación con otros activos</h2>
    <p class="mut" data-i18n="activo.corr_ayuda">Correlación de los retornos diarios.</p>
    <div id="correlaciones"></div>
  </section>
</div>
<section class="card" id="sec-nota" aria-labelledby="h-nota" hidden>
  <h2 id="h-nota" data-i18n="activo.nota_titulo">Nota del material del curso</h2>
  <p id="nota"></p>
</section>
