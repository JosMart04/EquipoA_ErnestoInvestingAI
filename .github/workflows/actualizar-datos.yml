name: Generar datos reales (artefacto para revisión)
on:
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [diario, cortes, completo]
        default: completo
permissions:
  contents: read
concurrency:
  group: generar-datos-reales
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r pipeline/requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/.cache
          key: pipeline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pipeline-${{ runner.os }}-
      - name: Generar y validar
        env:
          MODO_PEDIDO: ${{ inputs.modo }}
        run: |
          python -m pipeline.ejecutar --salida data_real --modo "$MODO_PEDIDO"
          python tools/validar_contrato.py data_real --modo real
      - name: Resultado para revisión y publicación mediante PR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datos-reales-validados
          path: data_real/
          retention-days: 7
