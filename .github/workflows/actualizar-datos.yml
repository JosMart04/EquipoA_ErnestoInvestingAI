name: Actualizar datos reales
on:
  schedule:
    - cron: "15 22 * * 1-5"
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [diario, cortes, completo]
        default: completo
permissions:
  contents: read
concurrency:
  group: publicar-datos-reales
  cancel-in-progress: false
jobs:
  generar:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r pipeline/requirements.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pipeline/.cache
          key: pipeline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pipeline-${{ runner.os }}-
      - name: Generar y validar
        env:
          MODO_MANUAL: ${{ inputs.modo }}
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            MODO="$MODO_MANUAL"
          elif [ "$HORARIO" = "0 6 * * 0" ]; then
            MODO=cortes
          else
            MODO=diario
          fi
          case "$MODO" in diario|cortes|completo) ;; *) exit 1 ;; esac
          python -m pipeline.ejecutar --salida data_real --modo "$MODO"
          python tools/validar_contrato.py data_real --modo real
      - name: Conservar resultado validado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datos-reales-validados
          path: data_real/
          retention-days: 7
      - name: Publicar exclusivamente data_real en main
        id: publicar
        run: |
          git add -A -- data_real
          if git diff --cached --quiet; then
            echo "No hay cambios de datos."
            exit 0
          fi
          git diff --cached --name-only -z | python -c "import sys; p=sys.stdin.buffer.read().split(bytes([0])); assert all(not f or f.startswith(b'data_real/') for f in p), 'Cambio fuera de data_real'"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: actualizar publicación real validada"
          git push origin HEAD:main
          echo "cambio=true" >> "$GITHUB_OUTPUT"
      - name: Reconstruir Pages con los datos publicados
        if: steps.publicar.outputs.cambio == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
