<body data-page="dashboard"><main>
<h1 data-i18n="dashboard.titulo">Dashboard de mercado</h1>
<p class="sub" data-i18n="dashboard.sub">Precios, variaciones y riesgo de los activos del universo.</p>
<!-- El aviso de simulación lo inserta js/common.js aquí, según el modo de datos -->
<div class="grid" id="kpis"></div>

<section class="card" aria-labelledby="h-controles">
  <h2 id="h-controles" data-i18n="dashboard.controles">Activo y periodo</h2>
  <div class="row">
    <div><label for="activo" data-i18n="comun.activo">Activo</label><select id="activo"></select></div>
    <div><span class="rotulo" data-i18n="dashboard.rango">Periodo</span><div id="rango"></div></div>
  </div>
  <div class="row" id="fechas" hidden>
    <div><label for="desde" data-i18n="dashboard.desde">Desde</label><input type="date" id="desde"></div>
    <div><label for="hasta" data-i18n="dashboard.hasta">Hasta</label><input type="date" id="hasta"></div>
  </div>
  <p id="nota-serie" class="mut" role="status"></p>
</section>

<div id="grafico"></div>

<section class="card" aria-labelledby="h-universo">
  <h2 id="h-universo" data-i18n="dashboard.universo_titulo">Universo de activos</h2>
  <div class="row"><div><label for="filtro-grupo" data-i18n="dashboard.filtro_grupo">Filtrar la tabla por grupo</label><select id="filtro-grupo"></select></div></div>
  <p class="mut" data-i18n="dashboard.universo_ayuda">Elige un ticker para ver su gráfico. La estrella lo agrega a tu watchlist.</p>
  <div id="universo"></div>
</section>
<script src="js/lib/i18n-calidad.js"></script>
<script src="js/lib/estadistica.js"></script>
<script src="js/lib/mercado.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</main></body></html>
