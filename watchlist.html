<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="watchlist.titulo_pagina">Watchlist y alertas · Ernesto Investing AI</title><link rel="stylesheet" href="css/styles.css">
<link rel="alternate" hreflang="es-PE" href="watchlist.html?lang=es-PE">
<link rel="alternate" hreflang="en-US" href="watchlist.html?lang=en-US">
<link rel="alternate" hreflang="x-default" href="watchlist.html"></head>
<body data-page="watchlist"><main>
<h1 data-i18n="watchlist.titulo">Watchlist y alertas</h1>
<p class="sub" data-i18n="watchlist.sub">Sigue tus activos y recibe un aviso cuando un precio o una variación cruza el límite que elijas.</p>
<!-- El aviso de simulación lo inserta js/common.js aquí, según el modo de datos -->
<p id="resumen-alertas" class="card resumen-alertas"></p>

<section class="card" aria-labelledby="h-lista">
  <h2 id="h-lista" data-i18n="watchlist.mi_lista">Mi watchlist</h2>
  <form id="form-agregar" class="row" novalidate>
    <div><label for="agregar" data-i18n="watchlist.agregar_rotulo">Agregar un activo (escribe el ticker o el nombre)</label>
      <input id="agregar" list="tickers" autocomplete="off" aria-describedby="agregar-error"><datalist id="tickers"></datalist>
      <p id="agregar-error" class="err" aria-live="polite"></p></div>
    <button type="submit" class="primary" data-i18n="watchlist.agregar">Agregar</button>
  </form>
  <p id="contador" class="mut" role="status"></p>
  <div id="lista"></div>
</section>

<section class="card" aria-labelledby="h-alertas">
  <h2 id="h-alertas" data-i18n="watchlist.alertas_titulo">Alertas</h2>
  <form id="form-alerta" class="row" novalidate>
    <div><label for="nuevo-ticker" data-i18n="comun.activo">Activo</label><select id="nuevo-ticker"></select></div>
    <div><label for="nuevo-tipo" data-i18n="watchlist.col_tipo">Condición</label><select id="nuevo-tipo"></select></div>
    <div><label for="nuevo-umbral" data-i18n="watchlist.col_umbral">Umbral</label><input id="nuevo-umbral" type="number" step="any" inputmode="decimal" aria-describedby="nuevo-umbral-ayuda nuevo-umbral-error">
      <p id="nuevo-umbral-ayuda" class="mut" data-i18n="watchlist.umbral_ayuda">En dólares para el precio; en porcentaje para la variación diaria.</p>
      <p id="nuevo-umbral-error" class="err" aria-live="polite"></p></div>
    <button type="submit" class="primary" data-i18n="watchlist.crear_alerta">Crear alerta</button>
  </form>
  <div id="alertas"></div>
</section>
<script src="js/lib/i18n-calidad.js"></script>
<script src="js/common.js"></script>
<script src="js/watchlist.js"></script>
</main></body></html>
