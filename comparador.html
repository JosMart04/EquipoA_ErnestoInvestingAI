<body data-page="comparador"><main data-esqueleto="grafico,tabla">
<h1 data-i18n="comparador.titulo">Comparador de activos</h1>
<p class="sub" data-i18n="comparador.sub">Compara la evolución de varios activos en la misma escala y su riesgo en el mismo periodo.</p>
<!-- El aviso de simulación lo inserta js/common.js aquí, según el modo de datos -->
<section class="card" aria-labelledby="h-seleccion">
  <h2 id="h-seleccion" data-i18n="comparador.activos_titulo">Activos comparados</h2>
  <ul id="seleccion" class="seleccion"></ul>
  <form id="form-agregar" class="row" novalidate>
    <div><label for="agregar-activo" data-i18n="comparador.agregar">Agregar un activo</label><select id="agregar-activo"></select></div>
    <div><button type="submit" id="btn-agregar" data-i18n="comparador.agregar_boton">Agregar</button></div>
    <div><span class="rotulo" data-i18n="dashboard.rango">Periodo</span><div id="periodo"></div></div>
  </form>
  <p id="aviso-maximo" class="mut" role="status"></p>
</section>
<div id="grafico"></div>
<section class="card" aria-labelledby="h-metricas">
  <h2 id="h-metricas" data-i18n="comparador.metricas_titulo">Rendimiento y riesgo en el periodo</h2>
  <p class="mut" data-i18n="comparador.declaracion">Calculado de los cierres del periodo elegido.</p>
  <div id="metricas"></div>
</section>
<section class="card" aria-labelledby="h-corr">
  <h2 id="h-corr" data-i18n="comparador.corr_titulo">Correlación entre los activos elegidos</h2>
  <div id="correlacion"></div>
</section>
<script src="js/lib/i18n-calidad.js"></script>
<script src="js/lib/estadistica.js"></script>
<script src="js/lib/mercado.js"></script>
<script src="js/common.js"></script>
<script src="js/comparador.js"></script>
</main></body></html>
