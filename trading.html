<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="trading.titulo_pagina">Trading simulado · Ernesto Investing AI</title><link rel="stylesheet" href="css/styles.css">
<link rel="alternate" hreflang="es-PE" href="trading.html?lang=es-PE">
<link rel="alternate" hreflang="en-US" href="trading.html?lang=en-US">
<link rel="alternate" hreflang="x-default" href="trading.html"></head>
<body data-page="trading"><main>
<h1 data-i18n="trading.titulo">Trading simulado</h1>
<p class="sub" data-i18n="trading.sub">Órdenes a mercado al último precio. El efectivo y las posiciones se guardan solo en este navegador.</p>
<!-- El aviso de simulación lo inserta js/common.js aquí, según el modo de datos -->
<div class="grid" id="resumen"></div>
<section class="card" id="aplicado" hidden></section>

<section class="card" aria-labelledby="h-orden">
  <h2 id="h-orden" data-i18n="trading.orden_titulo">Nueva orden</h2>
  <form id="form-orden" novalidate>
    <p id="orden-alerta" class="err" role="alert"></p>
    <div class="row">
      <div><label for="orden-activo" data-i18n="comun.activo">Activo</label>
        <select id="orden-activo" aria-describedby="precio-actual orden-activo-error"></select>
        <p id="orden-activo-error" class="err"></p></div>
      <fieldset class="lado"><legend data-i18n="trading.lado">Operación</legend>
        <label class="casilla"><input type="radio" name="lado" value="C" checked> <span data-i18n="trading.comprar">Comprar</span></label>
        <label class="casilla"><input type="radio" name="lado" value="V"> <span data-i18n="trading.vender">Vender</span></label></fieldset>
      <div><label for="orden-cantidad" data-i18n="trading.cantidad">Cantidad de acciones</label>
        <input id="orden-cantidad" type="number" min="1" step="1" inputmode="numeric" aria-describedby="orden-cantidad-error vista-previa">
        <p id="orden-cantidad-error" class="err"></p></div>
    </div>
    <p id="precio-actual" class="mut"></p>
    <p id="vista-previa" role="status" class="vista-previa"></p>
    <p class="acciones"><button type="submit" class="primary" data-i18n="trading.enviar">Enviar orden</button>
      <button type="button" id="reiniciar" data-i18n="trading.reiniciar">Reiniciar demo</button></p>
  </form>
</section>

<section class="card" aria-labelledby="h-posiciones">
  <h2 id="h-posiciones" data-i18n="trading.posiciones_titulo">Posiciones</h2>
  <div id="posiciones"></div>
</section>
<section class="card" aria-labelledby="h-historial">
  <h2 id="h-historial" data-i18n="trading.historial_titulo">Historial de órdenes</h2>
  <div id="historial"></div>
</section>
<script src="js/lib/i18n-calidad.js"></script>
<script src="js/common.js"></script>
<script src="js/trading.js"></script>
</main></body></html>
